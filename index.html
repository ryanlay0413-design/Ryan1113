<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 科技發展研討會 - 議程與報名</title>
  <script src="https://line-scdn.net"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    .card { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
    h1 { color: #38bdf8; font-size: 1.4rem; }
    .tag { background: #0284c7; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
    button { width: 100%; padding: 14px; background: #10b981; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:active { background: #059669; }
    .report-btn { background: #64748b; margin-top: 8px; }
  </style>
</head>
<body>

  <h1>🚀 2026 前瞻科技發展研討會</h1>
  <p id="welcome">正在讀取您的 LINE 資訊...</p>

  <div class="card">
    <span class="tag">10:00 - 11:30</span>
    <h3>主題一：邊緣 AI 與次世代晶片架構</h3>
    <p>探討本地端大型語言模型推論與低功耗硬體設計。</p>
    <button onclick="registerSession('邊緣 AI 與次世代晶片架構')">一鍵報名此場次</button>
  </div>

  <div class="card">
    <span class="tag">13:30 - 15:00</span>
    <h3>主題二：量子運算與資訊安全新局</h3>
    <p>解析後量子密碼學（PQC）對現代網路通訊的影響。</p>
    <button onclick="registerSession('量子運算與資訊安全新局')">一鍵報名此場次</button>
  </div>

  <button class="report-btn" onclick="reportIssue()">⚠️ 遇到問題？點此回報給大會</button>

  <script>
    const MY_LIFF_ID = "請填入您的_LIFF_ID"; // 範例: 2001234567-AbCdEfGh

    async function main() {
      await liff.init({ liffId: MY_LIFF_ID });
      if (!liff.isLoggedIn()) {
        liff.login();
      } else {
        const profile = await liff.getProfile();
        document.getElementById('welcome').innerText = `歡迎與會者：${profile.displayName}`;
      }
    }
    main();

    // 發送報名訊息回聊天室
    async function registerSession(topic) {
      if (!liff.isInClient()) {
        alert("請在手機版 LINE 應用程式中開啟此頁面以傳送報名訊息！");
        return;
      }
      await liff.sendMessages([{
        type: 'text',
        text: `我要報名研討會場次：【${topic}】`
      }]);
      alert("已幫您送出報名訊息！");
      liff.closeWindow();
    }

    // 快速回報問題
    async function reportIssue() {
      if (!liff.isInClient()) {
        alert("請在 LINE 聊天室中直接輸入「問題回報：您的問題」即可！");
        return;
      }
      await liff.sendMessages([{
        type: 'text',
        text: `問題回報：我在使用研討會系統時遇到問題，請協助處理。`
      }]);
      liff.closeWindow();
    }
  </script>
</body>
</html>
